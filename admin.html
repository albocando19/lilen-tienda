<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tienda · Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{--bg:#f6f4f1;--card:#fff;--ink:#1f1c19;--muted:#7a726a;--line:#e6e0d8;--ok:#2f6b3a;--warn:#a4462f;--chip:#efe9e1}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  .wrap{max-width:1000px;margin:0 auto;padding:0 16px}
  header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .bar{display:flex;align-items:center;gap:8px;height:56px}
  .bar h1{font-size:17px;margin:0;flex:1}
  .tabs{display:flex;gap:4px;overflow-x:auto}
  .tab{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .tab.on{background:var(--ink);color:#fff}
  /* En celu: título y Salir arriba, las 5 pestañas en su propio renglón, todas visibles */
  @media(max-width:700px){
    .bar{flex-wrap:wrap;height:auto;padding-top:8px;padding-bottom:8px;row-gap:8px}
    .bar h1{order:1}
    #salir{order:2}
    .tabs{order:3;width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;overflow:visible}
    .tab{text-align:center;padding:9px 2px;font-size:13px;background:#f1ece5}
    .tab.on{background:var(--ink)}
  }
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
  .btn{border:0;border-radius:8px;padding:8px 14px;background:var(--ink);color:#fff;cursor:pointer;font-weight:500}
  .btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.ok{background:var(--ok)} .btn.danger{background:var(--card);color:var(--warn);border:1px solid #e8c3b8}
  .btn:disabled{opacity:.5}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sp{flex:1}
  .muted{color:var(--muted)}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
  input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff}
  textarea{min-height:70px}
  .g2{display:grid;gap:0 12px;grid-template-columns:1fr}
  @media(min-width:640px){.g2{grid-template-columns:1fr 1fr}}
  .state{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;background:var(--chip)}
  .state.pagado,.state.enviado,.state.entregado{background:#e3f0e5;color:var(--ok)}
  .state.cancelado,.state.vencido{background:#fbeae5;color:var(--warn)}
  .filters{display:flex;gap:6px;overflow-x:auto;margin:14px 0 4px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  table{width:100%;border-collapse:collapse}
  td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{font-size:12px;color:var(--muted);font-weight:500}
  td input{padding:6px 8px}
  /* Matriz en celu: un renglón por combinación, campos chicos pero legibles */
  @media(max-width:700px){
    #vars th{font-size:11px;padding:4px 2px}
    #vars td{padding:6px 2px}
    #vars .v-lbl{font-size:14px;line-height:1.25;word-break:break-word}
    #vars td input:not([type=checkbox]){width:64px !important;font-size:16px;padding:8px 6px}
    #vars td input[data-f=precio]{width:74px !important}
    #vars .v-vis input{width:22px;height:22px}
  }
  .items-ped{display:flex;flex-direction:column;gap:8px;margin:10px 0}
  .item-ped{display:flex;gap:10px;align-items:flex-start}
  .item-foto{flex:none;width:56px;height:70px;border-radius:6px;overflow:hidden;border:1px solid var(--line);padding:0;background:#efe9e1;cursor:zoom-in}
  .item-foto img{width:100%;height:100%;object-fit:cover;display:block}
  .item-foto.sin{display:grid;place-items:center;font-size:10px;color:var(--muted);text-align:center;cursor:default}
  .item-txt{flex:1;min-width:0;line-height:1.35}
  .item-link{font-size:13px;color:#B0275F}
  .visor{position:fixed;inset:0;z-index:50;background:rgba(20,12,16,.92);display:flex;flex-direction:column}
  .visor-head{display:flex;align-items:center;gap:12px;padding:12px 16px;color:#fff}
  .visor-head a{color:#fff;font-size:14px}
  .visor-x{background:none;border:0;color:#fff;font-size:26px;cursor:pointer;padding:0 4px}
  .visor-fotos{flex:1;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 16px;align-items:center}
  .visor-fotos img{flex:0 0 100%;max-height:100%;object-fit:contain;scroll-snap-align:center;border-radius:8px}
  .visor-pie{color:#ddd;text-align:center;font-size:13px;padding-bottom:14px}
  tr.editado td{background:#FBE7EE}
  .tag-editado{display:inline-block;white-space:nowrap;background:#B0275F;color:#fff;border-radius:999px;font-size:11px;padding:1px 8px;margin-right:6px;vertical-align:middle}
  .thumb{width:44px;height:56px;object-fit:cover;border-radius:6px;background:var(--chip)}
  .err{background:#fbeae5;color:var(--warn);border-radius:8px;padding:8px 10px;margin:10px 0;display:none}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:9px 16px;display:none;z-index:9}
  .login{max-width:360px;margin:12vh auto}
  .fotos{display:flex;flex-wrap:wrap;gap:10px;min-height:20px}
  .foto{position:relative;width:96px}
  .foto img{width:96px;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;background:var(--chip)}
  .foto.portada img{border:2px solid var(--ink)}
  .foto .tag{position:absolute;top:4px;left:4px;background:var(--ink);color:#fff;font-size:11px;border-radius:999px;padding:1px 7px}
  .foto .acc{display:flex;gap:4px;margin-top:4px}
  .foto .acc button{flex:1;border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 0;cursor:pointer;font-size:13px}
  .foto .acc button:disabled{opacity:.35;cursor:default}
  .foto.subiendo img{opacity:.4}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const sb = supabase.createClient('https://jqqtjygmdoadofarnbco.supabase.co', 'sb_publishable_5fSvvUgb3kU5zIxmQFWJHg_CKP508Do',
  { auth: { storageKey: 'lilen-tienda-admin-auth' } }); // sesión separada: no pisa la de la caja
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plata = n => new Intl.NumberFormat('es-AR', { style:'currency', currency:'ARS', maximumFractionDigits:0 }).format(n || 0);
const fecha = d => new Date(d).toLocaleString('es-AR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
function toast(m){ const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2200); }
const em = e => (e && e.message) || 'Error';
const ESTADOS = { pendiente:'Esperando pago', pagado:'Pagado', enviado:'Enviado', entregado:'Entregado', cancelado:'Cancelado', vencido:'Vencido' };
function waLink(n){ let d = String(n).replace(/\D/g, ''); if (d.startsWith('0')) d = d.slice(1); if (!d.startsWith('54')) d = '549' + d; return 'https://wa.me/' + d; }

let tab = 'pedidos', filtro = 'pendiente', soyAdmin = false;
const PESTANAS = { pedidos:'Pedidos', productos:'Productos', categorias:'Categorías', clientas:'Clientas', ajustes:'Ajustes' };

async function inicio(){
  const { data } = await sb.auth.getSession();
  if (!data.session) return login();
  const { data: ok } = await sb.rpc('tienda_es_staff');
  if (!ok){ await sb.auth.signOut(); return login('Esta cuenta no tiene acceso al panel de la tienda.'); }
  const [{ data: adm }, { data: est }] = await Promise.all([sb.rpc('es_admin'), sb.from('tienda_config').select('cerrada').eq('id', 1).single()]);
  soyAdmin = !!adm;
  $('#app').innerHTML = `<header><div class="wrap bar"><h1>Tienda · Panel</h1>
      <div class="tabs">${Object.entries(PESTANAS).map(([t, n]) => `<button class="tab ${t === tab ? 'on' : ''}" data-t="${t}">${n}</button>`).join('')}</div>
      <button class="btn sec" id="salir">Salir</button></div></header>
    ${est && est.cerrada ? '<div style="background:#B0275F;color:#fff;text-align:center;padding:8px 16px;font-size:14px">La tienda está <strong>cerrada al público</strong>. Las clientas ven el cartel de "estamos actualizando".</div>' : ''}
    <main class="wrap" id="main"></main>`;
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.t; inicio(); });
  $('#salir').onclick = async () => { await sb.auth.signOut(); login(); };
  ({ pedidos, productos, categorias, clientas, ajustes })[tab]();
}

function login(msg){
  $('#app').innerHTML = `<div class="login card"><h2 style="margin:0 0 6px">Panel de la tienda</h2><p class="muted">Ingresá con tu usuario admin.</p>
    <label>Email</label><input id="lm" type="email" autocomplete="email"><label>Contraseña</label><input id="lp" type="password" autocomplete="current-password">
    <div class="err" id="le" style="${msg ? 'display:block' : ''}">${esc(msg || '')}</div><div style="margin-top:14px"><button class="btn" id="lg" style="width:100%">Ingresar</button></div></div>`;
  $('#lg').onclick = async () => {
    const { error } = await sb.auth.signInWithPassword({ email: $('#lm').value.trim(), password: $('#lp').value });
    if (error){ const e = $('#le'); e.textContent = em(error); e.style.display = 'block'; return; }
    inicio();
  };
}

// ---------- pedidos ----------
let fotosPedidos = new Map();
// Visor de fotos a pantalla completa (se cierra tocando afuera, con la ✕ o con Escape)
function verFotos(pr){
  if (!pr || !pr.fotos || !pr.fotos.length) return;
  const d = document.createElement('div'); d.className = 'visor';
  d.innerHTML = `<div class="visor-head"><strong>${esc(pr.nombre)}</strong><span class="sp"></span>
      <a href="./?p=${pr.id}" target="_blank" rel="noopener">Ver en la tienda ↗</a><button class="visor-x" aria-label="Cerrar">✕</button></div>
    <div class="visor-fotos">${pr.fotos.map(f => `<img src="${esc(f)}" alt="">`).join('')}</div>
    ${pr.fotos.length > 1 ? `<div class="visor-pie">${pr.fotos.length} fotos · deslizá para ver más</div>` : ''}`;
  const cerrar = () => { d.remove(); document.removeEventListener('keydown', esc_); };
  const esc_ = e => { if (e.key === 'Escape') cerrar(); };
  d.onclick = e => { if (e.target === d || e.target.classList.contains('visor-fotos') || e.target.closest('.visor-x')) cerrar(); };
  document.addEventListener('keydown', esc_);
  document.body.appendChild(d);
}
async function pedidos(){
  const M = $('#main');
  await sb.rpc('tienda_liberar_vencidos');
  const fs = ['pendiente','pagado','enviado','entregado','vencido','cancelado','todos'];
  let q = sb.from('tienda_pedidos').select('*, tienda_pedido_items(*, tienda_variantes(producto_id))').order('creado', { ascending:false }).limit(100);
  if (filtro !== 'todos') q = q.eq('estado', filtro);
  // Fotos de los productos: por el artículo del pedido, o por el nombre si el talle/artículo se borró
  const [{ data, error }, { data: prods }] = await Promise.all([q, sb.from('tienda_productos').select('id, nombre, fotos').limit(5000)]);
  const porId = new Map((prods || []).map(x => [x.id, x]));
  const porNombre = new Map((prods || []).map(x => [x.nombre.trim().toLowerCase(), x]));
  const prodDe = i => porId.get(i.tienda_variantes && i.tienda_variantes.producto_id) || porNombre.get((i.nombre || '').trim().toLowerCase()) || null;
  fotosPedidos = new Map();
  M.innerHTML = `<div class="filters">${fs.map(f => `<button class="chip ${f === filtro ? 'on' : ''}" data-f="${f}">${f === 'todos' ? 'Todos' : ESTADOS[f]}</button>`).join('')}</div>
    ${error ? `<div class="card">${esc(em(error))}</div>` : ''}
    ${(data || []).length ? '' : '<p class="muted" style="padding:30px 0;text-align:center">No hay pedidos acá.</p>'}
    ${(data || []).map(p => `<div class="card">
      <div class="row"><strong>#${p.id}</strong><span class="state ${p.estado}">${ESTADOS[p.estado]}</span><span class="muted">${fecha(p.creado)}</span><span class="sp"></span><strong>${plata(p.total)}</strong></div>
      <div style="margin:8px 0">${esc(p.nombre)} · <a href="${waLink(p.whatsapp)}" target="_blank" rel="noopener">${esc(p.whatsapp)}</a>${p.email ? ' · ' + esc(p.email) : ''}</div>
      <div class="muted">${p.entrega === 'envio' ? 'Envío: ' + esc(p.direccion) : 'Retira en el local'}${p.notas ? ' · Nota: ' + esc(p.notas) : ''}${p.envio ? ' · Envío ' + plata(p.envio) : ''}</div>
      <div class="items-ped">${p.tienda_pedido_items.map(i => { const pr = prodDe(i); const f = pr && pr.fotos && pr.fotos[0]; if (pr) fotosPedidos.set(pr.id, pr); return `<div class="item-ped">
        ${f ? `<button class="item-foto" data-verfoto="${pr.id}" aria-label="Ver fotos de ${esc(i.nombre)}"><img src="${esc(f)}" alt="" loading="lazy"></button>` : '<div class="item-foto sin">Sin foto</div>'}
        <div class="item-txt"><div><strong>${i.cant} ×</strong> ${esc(i.nombre)}</div>
          <div class="muted">${[i.talle && i.talle !== 'Único' ? 'Talle ' + esc(i.talle) : '', i.color ? esc(i.color) : ''].filter(Boolean).join(' · ')}${i.talle && i.talle !== 'Único' || i.color ? ' — ' : ''}${plata(i.precio * i.cant)}</div>
          ${pr ? `<a class="item-link" href="./?p=${pr.id}" target="_blank" rel="noopener">Ver en la tienda ↗</a>` : '<span class="muted" style="font-size:12px">El artículo ya no está en la tienda</span>'}</div>
      </div>`; }).join('')}</div>
      ${p.estado === 'pendiente' ? `<div class="muted" style="font-size:12px;margin-bottom:8px">Se libera el stock el ${fecha(p.vence_en)} si no paga.</div>` : ''}
      <div class="row">${acciones(p.estado).map(([e, t, c]) => `<button class="btn ${c}" data-p="${p.id}" data-e="${e}">${t}</button>`).join('')}</div>
    </div>`).join('')}`;
  M.querySelectorAll('.chip').forEach(b => b.onclick = () => { filtro = b.dataset.f; pedidos(); });
  M.querySelectorAll('[data-verfoto]').forEach(b => b.onclick = () => verFotos(fotosPedidos.get(+b.dataset.verfoto)));
  M.querySelectorAll('[data-e]').forEach(b => b.onclick = async () => {
    if (b.dataset.e === 'cancelado' && !confirm('¿Cancelar el pedido #' + b.dataset.p + '? El stock vuelve a estar disponible.')) return;
    b.disabled = true;
    const { data: res, error } = await sb.rpc('tienda_cambiar_estado', { p_pedido: +b.dataset.p, p_estado: b.dataset.e });
    if (error){ b.disabled = false; return alert(em(error)); }
    // Si al reactivar un pedido faltaba stock o había artículos borrados, se marca igual y se avisa qué revisar
    const faltan = (res && res.sin_stock) || [];
    if (faltan.length) alert(`Pedido #${b.dataset.p} marcado como ${ESTADOS[b.dataset.e].toLowerCase()}.\n\nOjo, de estas prendas no había stock y no se descontó:\n` +
      faltan.map(f => `• ${f.faltan} × ${f.nombre}${f.talle && f.talle !== 'Único' ? ' · talle ' + f.talle : ''}${f.color ? ' · ' + f.color : ''}${f.borrado ? ' (el artículo fue borrado)' : ''}`).join('\n') +
      `\n\nFijate si las tienen en el local antes de armar el pedido.`);
    else toast('Pedido #' + b.dataset.p + ': ' + ESTADOS[b.dataset.e]);
    pedidos();
  });
}
function acciones(e){
  return ({
    pendiente: [['pagado','Marcar pagado','ok'], ['cancelado','Cancelar','danger']],
    pagado:    [['enviado','Marcar enviado',''], ['entregado','Entregado',''], ['cancelado','Cancelar','danger']],
    enviado:   [['entregado','Entregado','']],
    vencido:   [['pagado','Pagó tarde: marcar pagado','sec']],
    cancelado: [['pendiente','Reactivar','sec']],
    entregado: []
  })[e] || [];
}

// ---------- productos ----------
let buscaProd = '', soloVisibles = false;
// Para volver al mismo lugar de la lista después de editar, y marcar el producto editado
let volverScroll = null, ultimoEditado = null;
async function productos(){
  const M = $('#main');
  const { data, error } = await sb.from('tienda_productos').select('*, tienda_variantes(*)').order('orden').order('creado', { ascending:false }).limit(5000);
  const t = buscaProd.trim().toLowerCase();
  const lista = (data || []).filter(p => (!t || (p.nombre + ' ' + (p.categoria || '')).toLowerCase().includes(t)) && (!soloVisibles || p.activo));
  M.innerHTML = `<div class="row" style="margin:14px 0"><span class="sp muted">${(data || []).length} productos · ${(data || []).filter(p => p.activo).length} visibles</span>
      <label class="btn sec" style="margin:0;color:var(--ink);font-size:14px">Importar Excel de Empretienda<input type="file" id="impP" accept=".xlsx,.xls" hidden></label>
      <button class="btn" id="nuevo">+ Nuevo producto</button></div>
    <div class="muted" id="impPMsg" style="margin-bottom:8px"></div>
    <div class="row"><input id="qp" placeholder="Buscar producto o categoría" value="${esc(buscaProd)}" style="flex:1;width:auto">
      <label style="margin:0;display:flex;gap:6px;align-items:center;color:var(--ink)"><input type="checkbox" id="sv" ${soloVisibles ? 'checked' : ''} style="width:auto"> Solo visibles</label></div>
    ${error ? `<div class="card">${esc(em(error))}</div>` : ''}
    <div class="card" style="padding:4px 10px"><table><tr><th></th><th>Producto</th><th>Precio</th><th>Stock</th><th></th></tr>
    ${lista.slice(0, 200).map(p => { const st = p.tienda_variantes.filter(v => v.activo).reduce((s, v) => s + v.stock, 0); return `<tr data-fila="${p.id}">
      <td>${p.fotos[0] ? `<img class="thumb" src="${esc(p.fotos[0])}" alt="">` : '<div class="thumb"></div>'}</td>
      <td>${esc(p.nombre)}${p.activo ? '' : ' <span class="state cancelado">oculto</span>'}${p.fotos.length ? '' : ' <span class="state">sin foto</span>'}<div class="muted" style="font-size:12px">${esc(p.categoria || '')}</div></td>
      <td>${plata(p.precio)}</td><td>${st}</td><td><button class="btn sec" data-id="${p.id}">Editar</button></td></tr>`; }).join('')}
    </table>${lista.length > 200 ? '<p class="muted">Mostrando 200. Buscá para filtrar.</p>' : ''}</div>`;
  $('#nuevo').onclick = () => editar(null);
  $('#impP').onchange = e => importarProductos(e.target.files[0]);
  let h; $('#qp').oninput = e => { buscaProd = e.target.value; clearTimeout(h); h = setTimeout(productos, 400); };
  $('#sv').onchange = e => { soloVisibles = e.target.checked; productos(); };
  M.querySelectorAll('[data-id]').forEach(b => b.onclick = () => editar(data.find(p => p.id === +b.dataset.id)));
  if (volverScroll !== null){
    const fila = ultimoEditado ? M.querySelector(`tr[data-fila="${ultimoEditado}"]`) : null;
    if (fila){
      fila.classList.add('editado');
      fila.querySelector('td:nth-child(2)').insertAdjacentHTML('afterbegin', '<span class="tag-editado">✓ Recién editado</span>');
      fila.scrollIntoView({ block: 'center' });
    } else window.scrollTo(0, volverScroll);
    volverScroll = null;
  }
}

async function importarProductos(file){
  if (!file) return;
  const msg = $('#impPMsg');
  if (!confirm('Esto crea o actualiza productos, precios y stock desde el Excel de Empretienda. Las fotos y descripciones que ya cargaste no se tocan. ¿Seguimos?')) return;
  try {
    msg.textContent = 'Leyendo archivo…';
    const wb = XLSX.read(await file.arrayBuffer());
    const filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'' });
    if (!filas.length || !('IDProduct' in filas[0])) throw new Error('No parece el Excel de productos de Empretienda (falta la columna IDProduct)');
    const prods = new Map();
    for (const f of filas){
      const pid = Number(f['IDProduct']); if (!pid) continue;
      if (!prods.has(pid)) prods.set(pid, { cab: f, vars: new Map() });
      let talle = '', color = '';
      for (const i of [1, 2, 3]){
        const n = String(f['Nombre atributo ' + i] || '').toLowerCase(), val = String(f['Valor atributo ' + i] || '').trim();
        if (!n && !val) continue;
        if (n.includes('talle')) talle = val; else color = [color, val].filter(Boolean).join(' ');
      }
      talle = talle || 'Único';
      const clave = talle.toLowerCase() + '|' + color.toLowerCase();
      const vs = prods.get(pid).vars;
      const stock = Math.max(0, parseInt(f['Stock'] || 0) || 0), precio = Number(f['Precio']) || 0;
      if (vs.has(clave)) vs.get(clave).stock += stock;
      else vs.set(clave, { ext_id: Number(f['IDStock']) || null, talle, color, stock, precio, oferta: Number(f['Precio oferta']) || null });
    }
    const filasP = [];
    for (const [pid, { cab, vars }] of prods){
      const vs = [...vars.values()];
      const ofertas = vs.map(v => v.oferta).filter(Boolean);
      const base = Math.min(...vs.map(v => v.precio));
      filasP.push({ ext_id: pid, nombre: String(cab['Nombre']).trim().slice(0, 120) || 'Sin nombre',
        categoria: String(cab['Categorías'] || '').split('>')[0].trim() || null,
        precio: ofertas.length ? Math.min(...ofertas) : base, precio_anterior: ofertas.length ? base : null,
        activo: String(cab['Mostrar en tienda']).trim().toLowerCase().startsWith('s') });
    }
    const idPorExt = new Map();
    for (let i = 0; i < filasP.length; i += 200){
      msg.textContent = `Productos: ${Math.min(i + 200, filasP.length)} de ${filasP.length}…`;
      const { data, error } = await sb.from('tienda_productos').upsert(filasP.slice(i, i + 200), { onConflict:'ext_id' }).select('id, ext_id');
      if (error) throw error;
      data.forEach(d => idPorExt.set(d.ext_id, d.id));
    }
    // Las categorías que vengan en el Excel y no existan se agregan a la lista
    const { data: catsYa } = await sb.from('tienda_categorias').select('nombre');
    const ya = new Set((catsYa || []).map(c => c.nombre.toLowerCase()));
    const nuevasCat = [...new Set(filasP.map(p => p.categoria).filter(c => c && !ya.has(c.toLowerCase())))];
    if (nuevasCat.length){ const { error } = await sb.from('tienda_categorias').insert(nuevasCat.map(nombre => ({ nombre, orden: 999 }))); if (error) throw error; }
    const filasV = [];
    for (const [pid, { vars }] of prods){
      const p = filasP.find(x => x.ext_id === pid), vs = [...vars.values()];
      const base = p.precio_anterior ? null : p.precio;
      for (const v of vs) filasV.push({ ext_id: v.ext_id, producto_id: idPorExt.get(pid), talle: v.talle.slice(0, 60), color: v.color.slice(0, 60),
        stock: v.stock, activo: true, precio: base !== null && v.precio !== base ? v.precio : null });
    }
    for (let i = 0; i < filasV.length; i += 500){
      msg.textContent = `Talles y stock: ${Math.min(i + 500, filasV.length)} de ${filasV.length}…`;
      const { error } = await sb.from('tienda_variantes').upsert(filasV.slice(i, i + 500), { onConflict:'ext_id' });
      if (error) throw error;
    }
    toast(`${filasP.length} productos importados`); productos();
  } catch (e) { msg.textContent = 'Error: ' + em(e); }
}

// ---- Variables de producto ----
const esTalle = n => /^\s*talles?\s*$/i.test(String(n || ''));
const esColor = n => /^\s*colou?r(es)?\s*$/i.test(String(n || ''));
const esUnico = t => /^[úu]nico$/i.test(String(t || '').trim());
function $$last(sel){ const l = document.querySelectorAll(sel); return l[l.length - 1]; }
// Variables del producto; los productos viejos (solo talle/color) se convierten solos
function atributosDe(p){
  if (Array.isArray(p.atributos) && p.atributos.length) return p.atributos.map(a => ({ nombre: a.nombre, valores: [...a.valores] }));
  const vs = p.tienda_variantes || [];
  const talles = [...new Set(vs.map(v => (v.talle || '').trim()).filter(Boolean))];
  const colores = [...new Set(vs.map(v => (v.color || '').trim()).filter(Boolean))];
  const a = [];
  if (talles.length && !talles.every(esUnico)) a.push({ nombre: 'Talle', valores: talles });
  if (colores.length) a.push({ nombre: 'Color', valores: colores });
  return a;
}
function opcionesDe(v, attrs){
  if (v.opciones && typeof v.opciones === 'object') return attrs.map(a => v.opciones[a.nombre] ?? '');
  return attrs.map(a => esTalle(a.nombre) ? (v.talle || '') : (v.color || ''));
}
const claveVals = vals => JSON.stringify(vals.map(x => String(x).trim().toLowerCase()));
const etiquetaVals = vals => vals.filter(Boolean).join(' · ');
function combinaciones(attrs){
  return attrs.filter(a => a.valores.length).reduce((acc, a) => acc.flatMap(c => a.valores.map(v => [...c, v])), [[]]);
}
// Para la tienda y los pedidos: "talle" es la variable Talle (o "Único") y "color" junta el resto
function talleColor(attrs, vals){
  const ti = attrs.findIndex(a => esTalle(a.nombre));
  return { talle: ti >= 0 ? String(vals[ti]).slice(0, 60) : 'Único', color: vals.filter((_, i) => i !== ti).join(' · ').slice(0, 120) };
}

async function editar(p){
  const M = $('#main');
  volverScroll = window.scrollY; ultimoEditado = p ? p.id : null;
  p = p || { nombre:'', descripcion:'', categoria:'', precio:'', precio_anterior:'', fotos:[], activo:true, orden:0, tienda_variantes:[] };
  const { data: cats } = await sb.from('tienda_categorias').select('nombre').order('orden').order('nombre');
  const nombresCat = (cats || []).map(c => c.nombre);
  // Si el producto tiene una categoría vieja que no está en la lista, se muestra igual para no perderla
  const huerfana = p.categoria && !nombresCat.includes(p.categoria);
  const opcionesCat = `<option value="">— Elegí una categoría —</option>` +
    (huerfana ? `<option value="${esc(p.categoria)}" selected>${esc(p.categoria)} (no está en la lista)</option>` : '') +
    nombresCat.map(n => `<option value="${esc(n)}" ${n === p.categoria ? 'selected' : ''}>${esc(n)}</option>`).join('');
  // ---- Variables (Talle, Color, Escote…) y matriz de combinaciones ----
  let attrs = atributosDe(p);
  const previas = new Map();   // combinaciones que ya existían, para no perder su id ni su stock
  (p.tienda_variantes || []).forEach(v => previas.set(claveVals(opcionesDe(v, attrs)), { ...v }));
  let filas = [];
  let stockDef = p.id ? 0 : 3;
  const regenerar = () => {
    const actual = new Map(filas.map(f => [claveVals(f.vals), f]));
    filas = combinaciones(attrs).map(vals => {
      const k = claveVals(vals);
      if (actual.has(k)) return { ...actual.get(k), vals };

          .map(([t, v]) => `<button class="link-btn" data-a="${i}" data-atajo="${esc(v)}">+ ${t}</button>`).join('')}</div>
      </div>`).join('') + (attrs.length < 3 ? `<button class="btn sec" id="addAttr">+ Agregar variable</button>` : '<p class="muted" style="font-size:13px">Máximo 3 variables por producto.</p>');
    const agregarVals = (i, texto) => {
      const nuevos = String(texto).split(/[,;\n]/).map(x => x.trim()).filter(Boolean);
      const a = attrs[i];
      for (const n of nuevos) if (!a.valores.some(v => v.toLowerCase() === n.toLowerCase())) a.valores.push(n.slice(0, 40));
      regenerar(); pintarAttrs(); pintarVars();
      const inp = $(`.attr-val[data-a="${i}"]`); if (inp) inp.focus();
    };
    $('#attrs').querySelectorAll('.attr-nom').forEach(inp => inp.onchange = () => {
      const i = +inp.dataset.a, nuevo = inp.value.trim().slice(0, 30);

    $('#vars').querySelectorAll('input').forEach(i => i.oninput = () => { const f = filas[+i.dataset.k]; f[i.dataset.f] = i.type === 'checkbox' ? i.checked : i.dataset.f === 'precio' ? (i.value === '' ? null : Math.max(0, Number(i.value))) : Math.max(0, parseInt(i.value || 0)); });

    <div class="g2"><div><label>Nombre</label><input id="pn" value="${esc(p.nombre)}"></div>
    <div><label>Categoría <span style="float:right">¿No está? Creala en la pestaña Categorías</span></label><select id="pc">${opcionesCat}</select></div>
    <div><label>Precio</label><input id="pp" type="number" min="0" value="${p.precio}"></div>
    <div><label>Precio anterior (para mostrar oferta, opcional)</label><input id="ppa" type="number" min="0" value="${p.precio_anterior ?? ''}"></div></div>
    <label>Descripción</label><textarea id="pd">${esc(p.descripcion)}</textarea>
    <label>Fotos <span style="float:right">La primera es la que se ve en la tienda</span></label>
    <div class="fotos" id="fotos"></div>
    <div class="row" style="margin-top:8px"><label class="btn sec" style="margin:0;color:var(--ink);font-size:14px">📷 Subir fotos<input type="file" id="pfup" accept="image/*" multiple hidden></label>
      <span class="muted" id="pfmsg" style="font-size:13px">Podés elegir varias juntas. Se achican solas para que la tienda cargue rápido.</span></div>
    <div class="g2"><div><label>Orden (menor = aparece primero)</label><input id="po" type="number" value="${p.orden}"></div>
    <div><label>Visible en la tienda</label><select id="pa"><option value="1" ${p.activo ? 'selected' : ''}>Sí</option><option value="0" ${p.activo ? '' : 'selected'}>No (oculto)</option></select></div></div>
    <h3 style="font-size:15px;margin:18px 0 4px">Variables</h3>
    <p class="muted" style="margin:0 0 8px;font-size:13px">Armá las variables del producto (Talle, Color, Escote…) y sus opciones. Se arman solas todas las combinaciones. Si no tiene variables, dejalo vacío y cargá un solo stock.</p>
    <div id="attrs"></div>
    <h3 style="font-size:15px;margin:18px 0 4px">Stock por combinación</h3>
    <div class="row" style="margin:4px 0 8px"><span class="muted" id="matrizInfo" style="font-size:13px"></span><span class="sp"></span>
      <label style="margin:0;display:flex;align-items:center;gap:6px;color:var(--ink)">Stock para todas <input id="stockTodas" type="number" min="0" inputmode="numeric" value="${stockDef}" style="width:70px"></label>
      <button class="btn sec" id="aplicarTodas">Aplicar</button></div>

  $('#aplicarTodas').onclick = () => {
    stockDef = Math.max(0, parseInt($('#stockTodas').value || 0));
    if (filas.length > 1 && !confirm(`¿Poner stock ${stockDef} en las ${filas.length} combinaciones?`)) return;
    filas.forEach(f => f.stock = stockDef); pintarVars(); toast('Stock aplicado a todas');
  };
  // ---- fotos: se suben, se achican a WebP y se ordenan con flechitas ----
  let fotos = [...(p.fotos || [])], subiendo = 0;
  const pintarFotos = () => {
    $('#fotos').innerHTML = fotos.map((f, k) => `<div class="foto ${k === 0 ? 'portada' : ''}">

    for (const [i, a] of archivos.entries()){
      msg.textContent = `Subiendo foto ${i + 1} de ${archivos.length}…`;
      try { fotos.push(await subirFoto(a)); ok++; pintarFotos(); }
      catch (er) { mal++; console.error(er); }
      subiendo--;
    }
    $('#guardar').disabled = subiendo > 0;
    msg.textContent = mal ? `Se subieron ${ok}. ${mal} no se pudo${mal > 1 ? 'ieron' : ''} leer: probá sacarle captura o mandarla por WhatsApp y volver a bajarla.` : `¡Listo! ${ok} foto${ok > 1 ? 's' : ''} subida${ok > 1 ? 's' : ''}. Acordate de tocar Guardar.`;
  };
  $('#volver').onclick = productos;
  const err = m => { const e = $('#pe'); e.textContent = m; e.style.display = 'block'; };
  if (p.id) $('#eliminar').onclick = async () => {
    if (!confirm('¿Eliminar "' + p.nombre + '"? Si tiene pedidos, mejor ocultalo en vez de eliminarlo.')) return;
    const { error } = await sb.from('tienda_productos').delete().eq('id', p.id);
    error ? err(em(error)) : (toast('Eliminado'), productos());
  };
  $('#guardar').onclick = async () => {
    const fila = {
      nombre: $('#pn').value.trim(), categoria: $('#pc').value.trim() || null, descripcion: $('#pd').value.trim() || null,
      precio: Number($('#pp').value), precio_anterior: $('#ppa').value ? Number($('#ppa').value) : null,
      fotos, orden: parseInt($('#po').value || 0), activo: $('#pa').value === '1'
    };
    if (!fila.nombre) return err('Falta el nombre');
    if (!fila.categoria) return err('Elegí una categoría');
    if (!(fila.precio >= 0) || $('#pp').value === '') return err('Falta el precio');
    // Variables: sin nombre o sin opciones no sirven
    const attrsOk = attrs.filter(a => a.valores.length);
    if (attrsOk.some(a => !a.nombre.trim())) return err('Ponele nombre a cada variable (ej: Talle, Color)');
    if (attrs.some(a => a.nombre.trim() && !a.valores.length)) return err(`La variable "${attrs.find(a => a.nombre.trim() && !a.valores.length).nombre}" no tiene opciones: agregale alguna o quitala`);
    if (filas.length > 300) return err('Son demasiadas combinaciones (máximo 300). Quitá alguna opción.');
    fila.atributos = attrsOk.map(a => ({ nombre: a.nombre.trim(), valores: a.valores }));
    const vsGuardar = filas.map(f => {
      const { talle, color } = talleColor(attrsOk, f.vals);
      const opciones = Object.fromEntries(attrsOk.map((a, i) => [a.nombre.trim(), f.vals[i]]));
      return { id: f.id ?? null, talle, color, opciones: attrsOk.length ? opciones : null, stock: f.stock || 0, precio: f.precio ?? null, activo: !!f.activo };
    });
    $('#guardar').disabled = true;
    const r = p.id ? await sb.from('tienda_productos').update(fila).eq('id', p.id).select().single()
                   : await sb.from('tienda_productos').insert(fila).select().single();
    if (r.error){ $('#guardar').disabled = false; return err(em(r.error)); }
    const pid = r.data.id;
    const g = await sb.rpc('tienda_guardar_variantes', { p_producto: pid, p_variantes: vsGuardar });
    if (g.error){ $('#guardar').disabled = false; return err(em(g.error)); }
    ultimoEditado = pid; toast('Guardado'); productos();
  };
}

// Achica la imagen (lado mayor 1200 px), la pasa a WebP y la sube al bucket "productos". Devuelve el link público.
async function subirFoto(archivo){
  const bmp = await createImageBitmap(archivo, { imageOrientation:'from-image' });
  const esc_ = Math.min(1, 1200 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * esc_); c.height = Math.round(bmp.height * esc_);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  let blob = await new Promise(r => c.toBlob(r, 'image/webp', 0.8));
  let ext = 'webp', tipo = 'image/webp';
  if (!blob || blob.type !== 'image/webp'){ blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82)); ext = 'jpg'; tipo = 'image/jpeg'; } // Safari viejo no hace WebP
  const nombre = `p-${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await sb.storage.from('productos').upload(nombre, blob, { contentType: tipo, cacheControl: '31536000' });
  if (error) throw error;
  return sb.storage.from('productos').getPublicUrl(nombre).data.publicUrl;
}

    ${lista.map((c, k) => { const n = cuenta[c.nombre] || { t:0, v:0 }; return `<tr>
      <td style="white-space:nowrap"><button class="btn sec" data-sube="${k}" ${k === 0 ? 'disabled' : ''} title="Subir">↑</button> <button class="btn sec" data-baja="${k}" ${k === lista.length - 1 ? 'disabled' : ''} title="Bajar">↓</button></td>
      <td><input data-nom="${c.id}" value="${esc(c.nombre)}" maxlength="60"></td>
      <td class="muted">${n.t} <span style="font-size:12px">(${n.v} visibles)</span></td>
      <td style="white-space:nowrap"><button class="btn sec" data-ren="${c.id}">Guardar nombre</button> <button class="btn danger" data-borra="${c.id}" ${n.t ? `disabled title="Tiene productos: pasalos a otra categoría antes de borrarla"` : ''}>✕</button></td></tr>`; }).join('')}
    </table>${lista.length ? '' : '<p class="muted">Todavía no hay categorías.</p>'}</div>`;
  const errC = m => { const e = $('#cerr2'); e.textContent = m; e.style.display = 'block'; };
  const agregar = async () => {
    const nombre = $('#cnueva').value.trim();
    if (nombre.length < 2) return errC('Escribí el nombre de la categoría');
    if (lista.some(c => c.nombre.toLowerCase() === nombre.toLowerCase())) return errC('Esa categoría ya existe');
    const orden = lista.length ? Math.max(...lista.map(c => c.orden)) + 1 : 1;
    const { error } = await sb.from('tienda_categorias').insert({ nombre, orden });
    error ? errC(em(error)) : (toast('Categoría agregada'), categorias());
  };
  $('#cagregar').onclick = agregar;
  $('#cnueva').onkeydown = e => { if (e.key === 'Enter') agregar(); };
  M.querySelectorAll('[data-ren]').forEach(b => b.onclick = async () => {
    const id = +b.dataset.ren, c = lista.find(x => x.id === id), nuevo = M.querySelector(`[data-nom="${id}"]`).value.trim();
    if (nuevo === c.nombre) return;
    const n = (cuenta[c.nombre] || { t:0 }).t;
    if (n && !confirm(`Se va a renombrar "${c.nombre}" a "${nuevo}" y se actualizan sus ${n} productos. ¿Seguimos?`)) return;
    const { error } = await sb.rpc('tienda_renombrar_categoria', { p_id: id, p_nombre: nuevo });
    error ? errC(em(error)) : (toast('Nombre actualizado'), categorias());
  });
  M.querySelectorAll('[data-borra]').forEach(b => b.onclick = async () => {
    const c = lista.find(x => x.id === +b.dataset.borra);
    if (!confirm(`¿Borrar la categoría "${c.nombre}"?`)) return;
    const { error } = await sb.from('tienda_categorias').delete().eq('id', c.id);
    error ? errC(em(error)) : (toast('Categoría borrada'), categorias());
  });
  const mover = async (k, d) => {
    // Reasigna el orden de toda la lista para que no queden empates
    const orden = lista.map(c => c.id); [orden[k], orden[k + d]] = [orden[k + d], orden[k]];
    for (let i = 0; i < orden.length; i++){
      const c = lista.find(x => x.id === orden[i]);
      if (c.orden !== i + 1){ const { error } = await sb.from('tienda_categorias').update({ orden: i + 1 }).eq('id', c.id); if (error) return errC(em(error)); }
    }
    categorias();
  };
  M.querySelectorAll('[data-sube]').forEach(b => b.onclick = () => mover(+b.dataset.sube, -1));
  M.querySelectorAll('[data-baja]').forEach(b => b.onclick = () => mover(+b.dataset.baja, 1));
}

// ---------- clientas ----------
let busca = '';
async function clientas(){
  const M = $('#main');
  const { count } = await sb.from('tienda_clientas_base').select('id', { count:'exact', head:true });
  M.innerHTML = `<div class="card"><div class="row"><strong class="sp">${(count || 0).toLocaleString('es-AR')} clientas en la base</strong>
      <label class="btn sec" style="margin:0;color:var(--ink);font-size:14px">Importar Excel de Empretienda<input type="file" id="imp" accept=".xlsx,.xls,.csv" hidden></label></div>
      <div class="muted" id="impMsg" style="margin-top:6px">Si importás de nuevo, se actualizan las que ya están (por email). El DNI no se guarda.</div></div>
    <input id="q" placeholder="Buscar por nombre, email o teléfono" value="${esc(busca)}">
    <div class="card" style="padding:4px 10px"><table id="tc"></table></div>`;
  $('#imp').onchange = e => importar(e.target.files[0]);
  let h; $('#q').oninput = e => { busca = e.target.value; clearTimeout(h); h = setTimeout(listar, 300); };
  listar();
}
async function listar(){
  let q = sb.from('tienda_clientas_base').select('*').order('nombre').limit(50);
  const t = busca.trim().replace(/[,()%*]/g, ' ').trim();
  if (t) q = q.or(`nombre.ilike.%${t}%,apellido.ilike.%${t}%,email.ilike.%${t}%,whatsapp.ilike.%${t.replace(/\D/g, '') || t}%`);
  const { data, error } = await q;
  $('#tc').innerHTML = error ? `<tr><td>${esc(em(error))}</td></tr>` : `<tr><th>Nombre</th><th>Email</th><th>WhatsApp</th><th>Localidad</th></tr>` +
    (data || []).map(c => `<tr><td>${esc(c.nombre)} ${esc(c.apellido)}</td><td>${esc(c.email)}</td>
      <td>${c.whatsapp ? `<a href="${waLink(c.whatsapp)}" target="_blank" rel="noopener">${esc(c.whatsapp)}</a>` : ''}</td><td>${esc(c.ciudad)}</td></tr>`).join('') +
    ((data || []).length === 50 ? '<tr><td colspan="4" class="muted">Mostrando 50. Buscá para filtrar.</td></tr>' : '');
}
async function importar(file){
  if (!file) return;
  const msg = $('#impMsg');
  try {
    msg.textContent = 'Leyendo archivo…';
    const wb = XLSX.read(await file.arrayBuffer());
    const filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'' });
    const txt = v => String(v ?? '').trim() || null;
    const porEmail = new Map();
    for (const f of filas){
      const email = String(f['Email'] || '').trim().toLowerCase();
      if (!email.includes('@')) continue;
      const dir = [txt(f['Dirección']), txt(f['Número'])].filter(Boolean).join(' ');
      const pd = [txt(f['Piso']) && 'Piso ' + txt(f['Piso']), txt(f['Dpto']) && 'Dto ' + txt(f['Dpto'])].filter(Boolean).join(' ');
      porEmail.set(email, { email, nombre: txt(f['Nombre']), apellido: txt(f['Apellido']),
        whatsapp: String(f['Teléfono'] || '').replace(/\D/g, '') || null,
        direccion: [dir, pd].filter(Boolean).join(', ') || null, ciudad: txt(f['Ciudad']), provincia: txt(f['Provincia']) });
    }
    const todas = [...porEmail.values()];
    if (!todas.length) throw new Error('No encontré la columna Email. ¿Es el Excel de clientes de Empretienda?');
    for (let i = 0; i < todas.length; i += 500){
      msg.textContent = `Importando ${Math.min(i + 500, todas.length)} de ${todas.length}…`;
      const { error } = await sb.from('tienda_clientas_base').upsert(todas.slice(i, i + 500), { onConflict:'email' });
      if (error) throw error;
    }
    toast(`${todas.length} clientas importadas`); clientas();
  } catch (e) { msg.textContent = 'Error: ' + em(e); }
}

// ---------- ajustes ----------
async function ajustes(){
  const M = $('#main');
  const { data: c } = await sb.from('tienda_config').select('*').eq('id', 1).single();
  // El interruptor de abrir/cerrar solo lo ven los admins (Beto y Ori). La base también lo bloquea para el resto.
  const bloqueCierre = soyAdmin ? `<div class="card" style="border-color:${c.cerrada ? '#B0275F' : 'var(--line)'}">
      <div class="row"><h2 style="margin:0;font-size:18px" class="sp">Estado de la tienda</h2>
        <span class="state ${c.cerrada ? 'cancelado' : 'pagado'}">${c.cerrada ? 'Cerrada al público' : 'Abierta'}</span></div>
      <p class="muted" style="margin:8px 0 0">${c.cerrada ? 'Las clientas ven el cartel de abajo y no pueden comprar. Ustedes, con el panel abierto, siguen viendo la tienda.' : 'Si la cerrás, las clientas ven un cartel y no pueden hacer pedidos. Los pedidos ya hechos no se tocan.'}</p>
      <label>Mensaje que ven las clientas</label><textarea id="cmsg">${esc(c.mensaje_cierre)}</textarea>
      <div class="row" style="margin-top:12px">
        <button class="btn ${c.cerrada ? 'ok' : 'danger'}" id="ctoggle">${c.cerrada ? 'Abrir la tienda' : 'Cerrar la tienda'}</button>
        <button class="btn sec" id="cmsgSave">Guardar mensaje</button>
        <a class="muted" href="./?vista=cierre" target="_blank" rel="noopener" style="margin-left:auto">Ver cómo se ve el cartel</a></div>
      <div class="err" id="cerr"></div></div>` : '';
  M.innerHTML = bloqueCierre + `<div class="card"><h2 style="margin:0;font-size:18px">Ajustes de la tienda</h2>
    <div class="g2">
      <div><label>Nombre de la tienda</label><input id="cn" value="${esc(c.nombre_tienda)}"></div>
      <div><label>WhatsApp donde llegan los pedidos (con 549, ej. 5491123456789)</label><input id="cw" value="${esc(c.whatsapp)}"></div>
      <div><label>Alias</label><input id="ca" value="${esc(c.alias)}"></div>
      <div><label>CBU / CVU</label><input id="cc" value="${esc(c.cbu)}"></div>
      <div><label>Titular de la cuenta</label><input id="ct" value="${esc(c.titular)}"></div>
      <div><label>Horas que se guarda un pedido sin pagar</label><input id="ch" type="number" min="1" max="168" value="${c.horas_reserva}"></div>
      <div><label>Compra mínima (0 = sin mínimo)</label><input id="cmin" type="number" min="0" value="${c.compra_minima}"></div>
      <div><label>Costo de envío (se suma al total si eligen envío)</label><input id="cenv" type="number" min="0" value="${c.costo_envio}"></div>
      <div><label>Instagram (sin @)</label><input id="cig" value="${esc(c.instagram)}"></div>
    </div>
    <label>Avisos de la barra de arriba (uno por línea)</label><textarea id="can">${esc(c.anuncio)}</textarea>
    <label>"Antes de comprar": condiciones, horarios, devoluciones (una por línea)</label><textarea id="cinf" style="min-height:110px">${esc(c.info_compra)}</textarea>
    <label>Nota sobre envíos (uso interno)</label><textarea id="ce">${esc(c.nota_envio)}</textarea>
    <div class="err" id="ce2"></div><div style="margin-top:14px"><button class="btn" id="cg">Guardar</button></div></div>`;
  $('#cg').onclick = async () => {
    const wa = $('#cw').value.replace(/\D/g, '');
    const { error } = await sb.from('tienda_config').update({
      nombre_tienda: $('#cn').value.trim() || 'Lilen Márquez', whatsapp: wa || null, alias: $('#ca').value.trim() || null,
      cbu: $('#cc').value.trim() || null, titular: $('#ct').value.trim() || null,
      horas_reserva: Math.min(168, Math.max(1, parseInt($('#ch').value || 48))), nota_envio: $('#ce').value.trim() || null,
      compra_minima: Math.max(0, Number($('#cmin').value || 0)), costo_envio: Math.max(0, Number($('#cenv').value || 0)),
      instagram: $('#cig').value.trim().replace(/^@/, '') || null, anuncio: $('#can').value.trim() || null, info_compra: $('#cinf').value.trim() || null
    }).eq('id', 1);
    if (error){ const e = $('#ce2'); e.textContent = em(error); e.style.display = 'block'; return; }
    toast('Guardado');
  };
  if (soyAdmin){
    const errC = m => { const e = $('#cerr'); e.textContent = m; e.style.display = 'block'; };
    $('#cmsgSave').onclick = async () => {
      const { error } = await sb.from('tienda_config').update({ mensaje_cierre: $('#cmsg').value.trim() || 'Estamos actualizando la página para darte un mejor servicio. ¡Volvemos muy pronto!' }).eq('id', 1);
      error ? errC(em(error)) : toast('Mensaje guardado');
    };
    $('#ctoggle').onclick = async () => {
      const cerrar = !c.cerrada;
      if (cerrar && !confirm('¿Cerrar la tienda al público? Las clientas van a ver el cartel y no van a poder comprar hasta que la vuelvas a abrir.')) return;
      const { error } = await sb.from('tienda_config').update({ cerrada: cerrar, mensaje_cierre: $('#cmsg').value.trim() || c.mensaje_cierre }).eq('id', 1);
      if (error) return errC(em(error));
      toast(cerrar ? 'Tienda cerrada al público' : 'Tienda abierta'); inicio();
    };
  }
}

inicio();
</script>
